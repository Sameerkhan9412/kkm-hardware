<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <!-- Background Gradient matching the app's theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090d16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#05070a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold Gradient for Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b89127;stop-opacity:1" />
    </linearGradient>

    <!-- Metallic/Silver Gradient for Handle -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  <rect x="1.5" y="1.5" width="397" height="297" fill="none" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="3" rx="14.5" />
  
  <!-- Decorative Grid Pattern Background -->
  <g opacity="0.05">
    <path d="M 0,30 L 400,30 M 0,60 L 400,60 M 0,90 L 400,90 M 0,120 L 400,120 M 0,150 L 400,150 M 0,180 L 400,180 M 0,210 L 400,210 M 0,240 L 400,240 M 0,270 L 400,270" stroke="#ffffff" stroke-width="1" />
    <path d="M 40,0 L 40,300 M 80,0 L 80,300 M 120,0 L 120,300 M 160,0 L 160,300 M 200,0 L 200,300 M 240,0 L 240,300 M 280,0 L 280,300 M 320,0 L 320,300 M 360,0 L 360,300" stroke="#ffffff" stroke-width="1" />
  </g>
  
  <!-- Hexagon Badge Background -->
  <polygon points="200,45 255,77 255,141 200,173 145,141 145,77" fill="#00A2E8" fill-opacity="0.03" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#goldGlow)" />
  
  <!-- Lock Icon Illustration -->
  <g transform="translate(170, 70)">
    <!-- Lock Shackle -->
    <path d="M 12,25 V 12 A 18,18 0 0,1 48,12 V 25" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="0" y="22" width="60" height="46" rx="8" fill="url(#silverGrad)" stroke="#64748b" stroke-width="1" />
    <!-- Keyhole -->
    <circle cx="30" cy="38" r="5" fill="#090d16" />
    <path d="M 28,42 L 32,42 L 34,54 L 26,54 Z" fill="#090d16" />
    <!-- Golden Accent Band -->
    <rect x="0" y="32" width="60" height="4" fill="url(#goldGrad)" opacity="0.8" />
  </g>
  
  <!-- Text Label -->
  <text x="50%" y="222" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff" letter-spacing="1">KMI PREMIUM HARDWARE</text>
  <text x="50%" y="246" dominant-baseline="middle" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="11" fill="#94a3b8" letter-spacing="2">IMAGE NOT AVAILABLE</text>
</svg>
